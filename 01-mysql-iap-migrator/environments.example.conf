# ==============================================================================
# ARQUIVO DE EXEMPLO DE AMBIENTES (WHITE-LABEL) — run.migrate v3.3
# Copie para 'environments.conf' para sobrescrever os valores padrão de exemplo.
# ==============================================================================

# Mapeamento de Pool Lógico -> Instâncias Compute Engine (separadas por espaço)
MAP["core-saas-prod-pool"]="core-appdb-prod-01 core-showcase-prod-01"
MAP["enterprise-alpha-pool"]="alpha-dedicated-db-01"
MAP["enterprise-beta-pool"]="beta-dedicated-db-01 beta-staging-db-01"
MAP["financial-prod-pool"]="fin-cluster-db-01"
MAP["saas-staging-pool"]="staging-appdb-01"
MAP["template-builder"]="template-builder-vm"

# Mapeamento de Pool Lógico -> Project ID real no Google Cloud Platform (GCP)
GCP_PROJECTS["core-saas-prod-pool"]="acme-core-prod-pool"
GCP_PROJECTS["enterprise-alpha-pool"]="acme-alpha-prod-pool"
GCP_PROJECTS["enterprise-beta-pool"]="acme-beta-prod-pool"
GCP_PROJECTS["financial-prod-pool"]="acme-fin-prod-pool"
GCP_PROJECTS["saas-staging-pool"]="acme-staging-test-pool"
GCP_PROJECTS["template-builder"]="acme-staging-test-pool"

# Zonas fallback estáticas caso a descoberta dinâmica via gcloud falhe
ZONES["core-appdb-prod-01"]="us-east1-b"
ZONES["core-showcase-prod-01"]="us-east1-c"
ZONES["alpha-dedicated-db-01"]="us-east1-c"
ZONES["beta-dedicated-db-01"]="us-east1-c"
ZONES["beta-staging-db-01"]="us-east1-d"
ZONES["fin-cluster-db-01"]="us-east1-c"
ZONES["staging-appdb-01"]="us-east1-c"
ZONES["template-builder-vm"]="us-east1-b"
